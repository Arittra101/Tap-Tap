# Unit tests exercise the data layer directly, so they must not boot the real
# TapTapApp: it calls startKoin(), and the global Koin context outlives a single test,
# so the second test in the JVM would fail with KoinApplicationAlreadyStartedException.
# A test that does want the real Application can ask for it with @Config(application = ...).
application=android.app.Application
sdk=34
